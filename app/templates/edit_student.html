
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
</head>
<body>
    <main>
        <h1>Edit Student Details</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p role="alert" class="{{ category }}">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('students.edit_student', student_id=student['id']) }}">

            <p>
                <label for="name">Student Name:</label><br>
                <input type="text" id="name" name="name"
                       value="{{ request.form.get('name', student['name']) }}"
                       required>
            </p>

            <p>
                <label for="prn">PRN:</label><br>
                <input type="text" id="prn" name="prn"
                       value="{{ request.form.get('prn', student['prn']) }}"
                       required>
            </p>

            <p>
                <label for="department">Department:</label><br>
                <input type="text" id="department" name="department"
                       value="{{ request.form.get('department', student['department']) }}"
                       required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"
                       value="{{ request.form.get('email', student['email']) }}"
                       required>
            </p>

            <button type="submit">Save Changes</button>
        </form>

        <p>
            <a href="{{ url_for('students.dashboard') }}">
                Cancel and Return to Dashboard
            </a>
        </p>
    </main>
</body>
</html>
